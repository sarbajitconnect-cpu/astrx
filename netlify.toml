[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/app"
  to = "https://astrxai.com/"
  status = 302
  force = true

[[redirects]]
  from = "/app.html"
  to = "https://astrxai.com/"
  status = 302
  force = true

[[redirects]]
  from = "/login"
  to = "https://astrxai.com/"
  status = 302
  force = true

[[redirects]]
  from = "/login.html"
  to = "https://astrxai.com/"
  status = 302
  force = true
